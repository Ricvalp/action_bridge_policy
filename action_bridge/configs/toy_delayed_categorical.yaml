seed: 0
device: cuda
benchmark: toy_delayed
trajectory_len: 64
chunk_horizon: 16
obs_history: 2
action_history: 2
action_dim: 2
obs_dim: 4
output_dir: outputs

data:
  num_contexts: 256
  paired_fraction: 0.5
  obstacle_center: [0.5, 0.5]
  obstacle_radius: 0.13
  lane_margin: 0.08
  start_mean: [0.12, 0.5]
  start_jitter: [0.03, 0.08]
  goal_mean: [0.88, 0.5]
  goal_jitter: [0.03, 0.08]
  shared_prefix_steps: 8
  shared_prefix_target_x: 0.30
  action_noise_std: 0.005
  speed: 0.035

model:
  policy_type: action_bridge
  hidden_dim: 128
  h_emb_dim: 128
  time_emb_dim: 32
  z_embed_dim: 32
  latent_type: categorical
  num_categories: 2
  z_dim: 4

reference:
  type: continuation
  alpha: 0.8
  sigma: 0.05
  learn_alpha: false
  learn_sigma: false

loss:
  beta_R: 0.01
  beta_z_start: 0.0
  beta_z_end: 0.01
  beta_z_warmup_steps: 10000
  free_nats: 0.1
  tube_training: false
  tube_noise_std_start: 0.0
  tube_noise_std_end: 0.02
  tube_noise_warmup_steps: 5000
  beta_aux_mode_ce: 0.0

optim:
  lr: 0.0003
  batch_size: 256
  max_steps: 100000
  grad_clip: 1.0

logging:
  log_every_steps: 25
  eval_every_steps: 100

inference:
  deterministic: true
  num_samples: 32
  latent_commitment: chunk
