[project]
name = "action-bridge-policy"
version = "0.1.0"
description = "Fail-fast execution-time action bridge policy experiment."
requires-python = ">=3.10"
dependencies = [
    "diffusers>=0.35.1",
    "matplotlib>=3.9.4",
    "ml-collections>=0.1.1,<1.1.0",
    "numpy>=2.0.2",
    "tqdm>=4.67.1",
    "torch==2.11.*",
    "wandb>=0.18.7",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
