[project]
name = "action-bridge-policy"
version = "0.1.0"
description = "Research pilot for latent path-KL controlled action bridge policies."
requires-python = ">=3.11,<3.13"
dependencies = [
  "h5py>=3.9",
  "matplotlib>=3.7",
  "ml-collections>=0.1.1",
  "numpy>=1.24",
  "phi-mujoco>=0.1.0,<0.2",
  "phi-rlbench>=0.1.0,<0.2",
  "plotly>=6.0",
  "tqdm>=4.66",
  "wandb>=0.16",
  "zarr>=2.16",
]

[project.optional-dependencies]
cpu = ["torch>=2.0"]
cu118 = ["torch>=2.0"]
cu126 = ["torch>=2.0"]
cu128 = ["torch>=2.0"]
cu130 = ["torch>=2.0"]
jax-cpu = [
  "flax>=0.10.0",
  "jax>=0.4.35",
  "optax>=0.2.4",
]
jax-cu13 = [
  "flax>=0.10.0; python_version >= '3.11'",
  "jax[cuda13]>=0.7.0; python_version >= '3.11'",
  "optax>=0.2.4; python_version >= '3.11'",
]
pusht-sim = [
  "gym-pusht>=0.1.5",
  "pymunk<7",
]
test = ["pytest>=8.0"]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu118" },
    { extra = "cu126" },
    { extra = "cu128" },
    { extra = "cu130" },
  ],
  [
    { extra = "jax-cpu" },
    { extra = "jax-cu13" },
  ],
]

[tool.uv.sources]
phi-mujoco = { path = "workspace/phi-mujoco", editable = true }
phi-rlbench = { path = "workspace/phi-rlbench", editable = true }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu118", extra = "cu118" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
